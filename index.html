<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Juego de adivina tu número</title>

    <style>
      html {
        font-family: sans-serif;
      }
      body {
        width: 50%;
        max-width: 800px;
        min-width: 480px;
        margin: 0 auto;
      }
      .lastResult {
        color: white;
        padding: 3px;
      }
    </style>
  </head>

  <body>
    <h1>Juego Adivina tu número</h1>
    
    <p>Hemos seleccionado un número aleatorio entre 1 a 100. Trata de adivinar el número, en un total de 10 turnos o menos. No te preocupes, te diremos si el número es más alto o más bajo.</p>
    
    <div class="form">
      <label for="guessField">Ingresa el número a adivinar: </label>
      <input type="text" id="guessField" class="guessField">
      <input type="submit" value="Ingresar el número aleatorio" class="guessSubmit">
    </div>
    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResult"></p>
      <p class="lowOrHi"></p>
    </div>

  </body>

  <script>
    // let randomNumber = Math.random() * 10;
    let randomNumber = Math.floor(Math.random() * 100) + 1; // Se corrigió la generación del número aleatorio
    
    // const ATTEMPS = 5;
    const ATTEMPTS = 10; // Se ajustó el número de intentos a 10 según los requisitos
    const guesses = document.querySelector('.guesses');
    const lastResult = document.querySelector('.lastResult');
    const lowOrHi = document.querySelector('.lowOrHi'); // Se corrigió la selección del elemento
    const guessSubmit = document.querySelector('.guessSubmit');
    const guessField = document.querySelector('.guessField');

    let guessCount = 1;
    let resetButton;

    function checkGuess() {

      // let userGuess = guessField.value;
      let userGuess = Number(guessField.value); // Se convierte a número
      
      // Se agregan condiciones para comparar el número
      if (isNaN(userGuess) || !Number.isInteger(userGuess) || userGuess < 1 || userGuess > 100) {
        alert('Por favor, ingrese un número entero entre 1 y 100.'); // Se agrega validación
        guessField.value = '';
        guessField.focus();
        return;
      }

      if (guessCount === 1) {
        guesses.textContent = 'Intentos anteriores: ';
      }
      guesses.textContent += userGuess + ' ';
      
      // Se modifica la condición para ganar
      /*
      if(userGuess === randomNumber) {
            lastResult.textContent = '!!!Pérdistes!!!';
            lastResult.style.backgroundColor = 'black';
            lowOrHi.textContent = '';
            setGameOver();
        }
      */
      if (userGuess === randomNumber) {
        lastResult.textContent = 'Felicitaciones! adivinaste el número!';
        lastResult.style.backgroundColor = 'green';
        lowOrHi.textContent = '';
        setGameOver();
      }// Se modifica la condición para perder
        /*
        else if(guessCount === ATTEMPS) {
            lastResult.textContent = 'Felicitaciones! adivinaste el número!';
            lastResult.style.backgroundColor = 'red';
            setGameOver();
        }
        */ 
        else if (guessCount === ATTEMPTS) {
        lastResult.textContent = '!!!Pérdistes!!!';
        lastResult.style.backgroundColor = 'red';
        setGameOver();
      } else {
        lastResult.textContent = 'Incorrecto!';
        if (userGuess < randomNumber) {
          // Se agregan las etiquetas de color
          lastResult.style.backgroundColor = 'black';
          lowOrHi.textContent = 'El número es mayor!';
        } else {
          // Se agregan las etiquetas de color
          lastResult.style.backgroundColor = 'black';
          lowOrHi.textContent = 'El número es menor!';
        }
      }
      
      guessCount++;
      guessField.value = '';
      guessField.focus();
    }
    // guessSubmit.addeventListener('click', checkGuess);
    guessSubmit.addEventListener('click', checkGuess); // Se corrigió 'addeventListener' por 'addEventListener'

    function setGameOver() {
      guessField.disabled = true;
      guessSubmit.disabled = true;
      resetButton = document.createElement('button');
      resetButton.textContent = 'Comienza un nuevo juego';
      document.body.appendChild(resetButton);
      // resetButton.addeventListener('click', resetGame);
      resetButton.addEventListener('click', resetGame); // Se corrigió 'addeventListener'
    }

    function resetGame() {
      guessCount = 1;
      const resetParas = document.querySelectorAll('.resultParas p');
      for (let i = 0; i < resetParas.length; i++) {
        resetParas[i].textContent = '';
      }
      resetButton.parentNode.removeChild(resetButton);

      guessField.disabled = false;
      guessSubmit.disabled = false;
      guessField.value = '';
      guessField.focus();
      
      lastResult.style.backgroundColor = 'white';

      // randomNumber = Math.floor(Math.random()) + 1;
      randomNumber = Math.floor(Math.random() * 100) + 1; // Se generó correctamente un nuevo número aleatorio
    }
  </script>
</html>
